<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Social Content: brand kit in, on-brand posts and reels out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1A2E"/>
      <stop offset="1" stop-color="#2A2346"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FFC15E"/>
    </linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB38A"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C6CF2"/>
      <stop offset="1" stop-color="#4E8CF0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="40" r="160" fill="#7C6CF2" opacity="0.10"/>
  <circle cx="1010" cy="360" r="120" fill="#FF8A5B" opacity="0.10"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Social Content</text>
    <rect x="74" y="172" width="120" height="6" rx="3" fill="url(#accent)"/>
    <text x="72" y="228" font-size="28" font-weight="500" fill="#D9D6F0">Brand kit in. On-brand posts and reels out.</text>
    <text x="72" y="270" font-size="20" fill="#A39FC4">For Claude Desktop · Designs in Penpot · Reels · Insights</text>
  </g>

  <g transform="translate(-30,0)">
  <!-- brand kit -->
  <g filter="url(#shadow)">
    <rect x="770" y="96" width="132" height="168" rx="16" fill="#F4F1EA"/>
    <rect x="770" y="96" width="132" height="34" rx="16" fill="#E6E0D2"/>
    <rect x="770" y="114" width="132" height="16" fill="#E6E0D2"/>
    <circle cx="806" cy="166" r="18" fill="#FF8A5B"/>
    <circle cx="836" cy="166" r="18" fill="#7C6CF2"/>
    <circle cx="866" cy="166" r="18" fill="#1B1A2E"/>
    <rect x="790" y="202" width="92" height="9" rx="4.5" fill="#BDB5A3"/>
    <rect x="790" y="220" width="64" height="9" rx="4.5" fill="#D3CCBC"/>
    <rect x="790" y="238" width="78" height="9" rx="4.5" fill="#D3CCBC"/>
  </g>

  <path d="M916 180 h28 m-10 -10 l10 10 l-10 10" stroke="#A39FC4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- post 4:5 -->
  <g filter="url(#shadow)">
    <rect x="960" y="92" width="140" height="175" rx="14" fill="url(#post)"/>
    <rect x="984" y="118" width="62" height="86" rx="8" fill="#FFFFFF" opacity="0.92"/>
    <rect x="1056" y="124" width="30" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="1056" y="140" width="22" height="8" rx="4" fill="#FFFFFF" opacity="0.6"/>
    <rect x="984" y="220" width="96" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="984" y="238" width="64" height="10" rx="5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <path d="M1114 180 h28 m-10 -10 l10 10 l-10 10" stroke="#A39FC4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- reel 9:16 -->
  <g filter="url(#shadow)">
    <rect x="1156" y="64" width="112" height="232" rx="20" fill="#0F0E1A"/>
    <rect x="1162" y="70" width="100" height="220" rx="15" fill="url(#reel)"/>
    <rect x="1182" y="112" width="60" height="75" rx="7" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="1212" cy="232" r="20" fill="#FFFFFF" opacity="0.95"/>
    <path d="M1206 221 l17 11 l-17 11 z" fill="#4E8CF0"/>
    <rect x="1176" y="268" width="72" height="5" rx="2.5" fill="#FFFFFF" opacity="0.45"/>
    <rect x="1176" y="268" width="40" height="5" rx="2.5" fill="#FFFFFF"/>
  </g>
  </g>
</svg>
